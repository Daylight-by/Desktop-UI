id: "@seelen/apps-menu"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
instances: Single
loader: Internal
preset: Overlay
hidden: true
lazy: true
settings:
  - type: select
    key: defaultView
    label: !extend i18n/settings/default-view.yml
    options:
      - label: !extend i18n/settings/default-view-favorites.yml
        value: favorites
        icon: TbStar

      - label: !extend i18n/settings/default-view-all.yml
        value: all
        icon: TbLayoutList
    defaultValue: all
  - type: range
    key: backgroundOpacity
    label: !extend i18n/settings/background-opacity.yml
    min: 0
    max: 100
    step: 5
    defaultValue: 100
shortcuts:
  - id: apps-menu-toggle
    command: ["widget", "trigger", "${self.id}"]
    label: !extend i18n/shortcuts/apps-menu-toggle.yml
    defaultKeys: ["Win"]
    readonly: true
    system: true
